appId: com.classroom.accommodations
productName: Bloom
copyright: Bloom

directories:
  output: dist-electron
  buildResources: build

files:
  - electron/**/*
  - package.json

extraResources:
  - from: dist-renderer
    to: dist-renderer
    filter:
      - '**/*'

asar: true
compression: maximum

win:
  target:
    - target: portable
      arch:
        - x64
  icon: build/icon.ico
  # Unsigned. District AppLocker / SmartScreen implications are documented in the README.
  # signExecutable (not signAndEditExecutable) so the exe still gets the Bloom
  # icon and version metadata stamped in; signAndEditExecutable: false would
  # skip the icon along with the signature.
  signExecutable: false

portable:
  # Lower case, matching every build handed out so far, so the download keeps
  # the name people have already seen.
  #
  # Note this is the OUTPUT FILENAME only. What moves userData is productName in
  # package.json, which Electron reads for app.getName(): the one in this file
  # stamps the exe metadata and nothing else. Both were renamed together on day
  # zero, while every copy in the wild was a beta and no licence or records
  # pointer existed to be stranded in the old %APPDATA% folder. After a single
  # sale that stops being true, and a rename would need to carry location.json
  # and licence.json across.
  artifactName: 'bloom.exe'
  # unpackDirName is deliberately NOT set. The default derives a stable directory
  # name from productName + version, so a relaunch reuses the existing unpack
  # instead of re-extracting ~86 MB — a real difference from a USB stick.
  # Setting it to `false` does the opposite: a random dir per launch. Verified by
  # observing the unpack path in app.log.
  #
  # Consequence, and the reason data.json cannot live "next to the exe": the app
  # always runs from %TEMP%\<hash>\, never from the folder the user sees.
